// infcore gateway - an example configuration (validated against config/schema/gateway.schema.json).
// JSONC format (JSON + // comments). Everything is offline: local weights, no egress.
{
  "server": {
    "host": "127.0.0.1",
    "port": 8080,
    // worker pool size = ceiling on concurrent requests (SSE holds a worker for the whole stream)
    "max_concurrent_requests": 64,
    "request_timeout_ms": 120000,   // timeout of the request to the backend
    "read_timeout_ms": 30000,       // slowloris protection (client sending the request slowly)
    "write_timeout_ms": 120000,     // frees the worker when an SSE consumer is dead
    "max_body_bytes": 8388608       // request body ceiling (OOM protection)
  },
  "security": {
    "authn": "api_key",
    "rbac_enabled": true,
    // api_key supports secret injection: "env:VAR" or "file:/path" (see DEPLOY.md).
    // Keys must never be kept in the config in plain text — these are references to
    // environment variables (from EnvironmentFile / gateway.env).
    "principals": [
      { "api_key": "env:INFCORE_KEY_ADMIN", "subject": "alice",   "role": "admin" },
      { "api_key": "env:INFCORE_KEY_EMBED", "subject": "svc-embed", "role": "embeddings-only" },
      { "api_key": "env:INFCORE_KEY_RERANK", "subject": "svc-rerank", "role": "rerank-only" }
    ],
    "roles": [
      { "name": "admin",           "allow_models": ["*"], "allow_endpoints": ["*"] },
      { "name": "embeddings-only", "allow_models": ["bge-m3-embed"],
        "allow_endpoints": ["/v1/embeddings", "/v1/models"] },
      { "name": "rerank-only",     "allow_models": ["bge-reranker"],
        "allow_endpoints": ["/v1/rerank", "/v1/reranking", "/rerank", "/reranking", "/v1/models"] }
    ],
    // require=true (the default): if the journal fails to open, the gateway does not start
    // (no traffic without audit). The directory is created by systemd (LogsDirectory), or
    // mount it under Docker.
    "audit": { "sink": "file", "path": "/var/log/infcore/audit.log", "require": true }
  },
  "observability": { "metrics_enabled": true, "metrics_path": "/metrics" },
  "offline": {
    "enforce_no_egress": true,
    // For a final release config set this to true and fill in sha256/size_bytes for the models.
    "require_model_integrity": false
  },
  "runtime": {
    "llama_server_bin": "/opt/infcore/bin/llama-server",
    "port_range_start": 8100,
    "max_loaded_models": 2,
    "max_parallel_starts": 1,
    "rate_limit_per_minute": 0,
    "idle_timeout_ms": 300000,
    "startup_timeout_ms": 120000
  },
  "models": [
    {
      "logical_name": "qwen3-moe-a3b",
      "gguf_path": "/opt/infcore/models/qwen3-moe-a3b-Q4_K_M.gguf",
      "arch": "qwen3moe",
      "license": "model-license-id",
      "source": "internal-model-registry/qwen3-moe-a3b",
      "modality": "text",
      "enabled": true,
      "n_ctx": 8192,
      "n_gpu_layers": 999
    },
    {
      "logical_name": "bge-m3-embed",
      "gguf_path": "/opt/infcore/models/bge-m3-Q8_0.gguf",
      "license": "model-license-id",
      "source": "internal-model-registry/bge-m3",
      "modality": "embedding",
      "enabled": false,
      "n_ctx": 8192
    },
    {
      "logical_name": "bge-reranker",
      "gguf_path": "/opt/infcore/models/bge-reranker-v2-m3-Q8_0.gguf",
      "license": "model-license-id",
      "source": "internal-model-registry/bge-reranker-v2-m3",
      "modality": "rerank",
      "enabled": false,
      "n_ctx": 8192
    }
  ]
}
