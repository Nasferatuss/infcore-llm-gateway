# infcore — reverse-proxy с TLS-терминацией (Angie; конфиг совместим с nginx).
#
# Зачем прокси, а не TLS внутри gateway:
#   - перевыпуск сертификата = reload прокси, а не рестарт gateway. Рестарт шлюза
#     означает выгрузку модели и повторную проверку sha256 (на 25 GiB это десятки
#     секунд простоя) — ради смены сертификата это неприемлемо;
#   - TLS-стек не попадает в security-critical путь самого шлюза;
#   - gateway остаётся HTTP на loopback: наружу его порт не публикуется вовсе.
#
# Установка: положить в /etc/angie/http.d/ (или /etc/nginx/conf.d/), проверить
# `angie -t`, затем `systemctl reload angie`.

upstream infcore_gateway {
    # Gateway слушает только loopback (config: server.host=127.0.0.1).
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> только редирект на HTTPS. Голый HTTP наружу не отдаём.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name infcore.internal;   # <- ваш FQDN; должен совпадать с CN/SAN сертификата

    # --- TLS -----------------------------------------------------------------
    # Сертификат от ВНУТРЕННЕГО CA: ACME/Let's Encrypt в offline-контуре невозможен.
    ssl_certificate     /etc/angie/tls/infcore.crt;   # fullchain: сертификат + промежуточные
    ssl_certificate_key /etc/angie/tls/infcore.key;   # chmod 600, владелец — пользователь прокси

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;      # для TLS1.3 порядок задаёт клиент; для 1.2 набор ниже уже безопасен
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;            # без ротации ключей тикетов они ломают forward secrecy

    # HSTS: только если весь контур точно на HTTPS — иначе заблокируете себе откат.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Тело и таймауты -----------------------------------------------------
    # Должны быть НЕ строже, чем у gateway (server.max_body_bytes, *_timeout_ms),
    # иначе прокси начнёт резать запросы раньше шлюза и вы будете искать причину
    # не там. Инференс долгий: держим большой read-таймаут вверх по потоку.
    client_max_body_size 8m;            # = server.max_body_bytes (8388608)
    proxy_connect_timeout 5s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;         # >= server.request_timeout_ms

    location / {
        proxy_pass http://infcore_gateway;
        proxy_http_version 1.1;

        # Реальный IP клиента: gateway пишет client_ip в audit-журнал, и без этого
        # там будет 127.0.0.1 у КАЖДОЙ записи — аудит станет бесполезен.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host             $host;

        # SSE (stream=true): буферизация превратила бы поток токенов в один
        # ответ в конце — TTFT уехал бы с секунды до минут.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
    }

    # /metrics в самом gateway отдаётся БЕЗ авторизации (он рассчитан на loopback).
    # Наружу его выпускать нельзя: счётчики ошибок и endpoint'ов — операционная
    # разведка. Пускаем только сеть мониторинга.
    location = /metrics {
        allow 10.0.0.0/8;               # <- подсеть VictoriaMetrics/Prometheus
        allow 127.0.0.1;
        deny all;
        proxy_pass http://infcore_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
