# infcore — a reverse proxy with TLS termination (Angie; the config is nginx-compatible).
#
# Why a proxy rather than TLS inside the gateway:
#   - renewing a certificate becomes a proxy reload instead of a gateway restart. Restarting
#     the gateway unloads the model and re-verifies its sha256 (tens of seconds of downtime
#     at 25 GiB) — unacceptable just to swap a certificate;
#   - the TLS stack stays out of the gateway's own security-critical path;
#   - the gateway stays plain HTTP on loopback: its port is never published outward.
#
# Install: drop it into /etc/angie/http.d/ (or /etc/nginx/conf.d/), check it with
# `angie -t`, then `systemctl reload angie`.

upstream infcore_gateway {
    # The gateway listens on loopback only (config: server.host=127.0.0.1).
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> redirect to HTTPS only. Plain HTTP is never served outward.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name infcore.internal;   # <- your FQDN; must match the certificate's CN/SAN

    # --- TLS -----------------------------------------------------------------
    # A certificate from an INTERNAL CA: ACME/Let's Encrypt is impossible offline.
    ssl_certificate     /etc/angie/tls/infcore.crt;   # fullchain: leaf + intermediates
    ssl_certificate_key /etc/angie/tls/infcore.key;   # chmod 600, owned by the proxy's user

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;      # TLS 1.3 lets the client choose; for 1.2 the list below is already safe
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;            # without ticket-key rotation they break forward secrecy

    # HSTS: only if the whole deployment is definitely on HTTPS — otherwise you lock yourself
    # out of rolling back.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Body size and timeouts ----------------------------------------------
    # These must be NO stricter than the gateway's (server.max_body_bytes, *_timeout_ms), or
    # the proxy will start rejecting requests before the gateway does and you will look for
    # the cause in the wrong place. Inference is slow: keep a large upstream read timeout.
    client_max_body_size 8m;            # = server.max_body_bytes (8388608)
    proxy_connect_timeout 5s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;         # >= server.request_timeout_ms

    location / {
        proxy_pass http://infcore_gateway;
        proxy_http_version 1.1;

        # The client's real IP: the gateway writes client_ip into the audit journal, and
        # without this EVERY record would read 127.0.0.1 — the audit trail becomes useless.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host             $host;

        # SSE (stream=true): buffering would turn the token stream into a single response at
        # the end — TTFT would go from a second to minutes.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
    }

    # The gateway serves /metrics WITHOUT authentication (it is meant for loopback). It must
    # not be exposed outward: error counters and the endpoint list are operational
    # intelligence. Only the monitoring network is allowed in.
    location = /metrics {
        allow 10.0.0.0/8;               # <- the VictoriaMetrics/Prometheus subnet
        allow 127.0.0.1;
        deny all;
        proxy_pass http://infcore_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
