# infcore — a local stack for an offline deployment. In production the images come from the
# deployment's own registry.
#
# NETWORK TOPOLOGY (important: it is easy to build either a broken or a leaky stack here):
#
#   edge      an ordinary network. angie ONLY. Publishing 443 outward works through it.
#   internal  internal: true, NO route to the internet. gateway, victoriametrics, angie.
#
#   The gateway sits ONLY on internal and publishes NO ports outward: angie reaches it from
#   inside the network as http://gateway:8080.
#
# Why it is not simpler. Docker's `internal: true` does cut egress, but it also BREAKS port
# publishing: a container attached only to an internal network is unreachable from outside
# even with ports: set. Verified experimentally (same image: ordinary network + -p ->
# reachable; internal only + -p -> unreachable). That is why angie faces outward, not the
# gateway.
#
# The flip side: angie, being on edge, does have egress. That is deliberate — it is the
# entry point and must be visible. The offline invariant is held where it matters, on the
# gateway that touches models and data, and it is held by three lines of defence: the
# internal network, offline.enforce_no_egress inside the gateway itself, and, on the systemd
# path, IPAddressDeny as well. In a genuinely closed network the host has no internet at
# all, so edge means access to the stand, not access to the internet.
#
# Before starting:
#   1. cp gateway.env.example gateway.env and fill in real keys (openssl rand -hex 32).
#   2. Put the internal CA's certificate in /etc/infcore/tls/{infcore.crt,infcore.key}
#      (key: chmod 600). ACME/Let's Encrypt is impossible in an offline deployment.
#   3. In angie/infcore.conf fix up server_name and the allowlist for /metrics.
#   4. INFCORE_HOST=0.0.0.0 (below) makes the gateway listen on all interfaces INSIDE the
#      container; the mounted config stays read-only with host=127.0.0.1 — the env override
#      wins. Managed llama-server processes still listen on loopback inside the container
#      and still require the per-boot api key.
#   5. Set server.trusted_proxies in the gateway config to angie's subnet — otherwise, behind
#      the proxy, EVERY audit record will carry the proxy's own client_ip.
services:
  gateway:
    image: infcore/gateway:0.1.0
    build:
      context: ../../..          # the root of the engine tree
      dockerfile: infcore/deploy/docker/Dockerfile
    restart: unless-stopped                        # a crashed container comes back on its own
    volumes:
      - /opt/infcore/models:/opt/infcore/models:ro
      - ../../config/gateway.yaml:/opt/infcore/config/gateway.yaml:ro   # read-only; INFCORE_HOST overrides host
      - /var/log/infcore:/var/log/infcore          # append-only audit journal (writable)
    environment:
      - INFCORE_HOST=0.0.0.0                        # listen on all interfaces INSIDE the container
    env_file:
      - path: ./gateway.env                        # secrets for env:VAR in the config (Compose >= 2.24)
        required: false
    # The gateway's port is NOT published outward at all: the entry point is angie with TLS.
    # Inside the compose network the gateway is reachable as gateway:8080 (see the upstream in
    # angie/infcore.conf). If you are not using angie, put back: ports: ["127.0.0.1:8080:8080"].
    expose: ["8080"]
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # NOTE: this is sized PER MODEL; 16g is only a default for small GGUFs.
    # The gateway itself takes single-digit MB, but the child llama-server holds in RAM
    # everything that did not go to VRAM. Measured: Qwen3.6-35B-A3B Q5_K_M (25.2 GiB on disk)
    # with a partial offload to an 8 GiB GPU -> RSS/PSS ~20.2 GiB, i.e. with 16g the container
    # gets killed by the OOM killer. Rule of thumb: mem_limit >= GGUF size minus what actually
    # went to VRAM, plus headroom for the KV cache and compute buffers.
    mem_limit: 16g
    healthcheck:
      test: ["CMD", "/opt/infcore/bin/infcore-cli", "--url", "http://127.0.0.1:8080", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices: [{ capabilities: [gpu] }]   # NVIDIA with GGML_CUDA=ON (needs nvidia-container-toolkit)

  # --- TLS termination --------------------------------------------------------
  # The deployment's entry point. TLS is terminated here rather than in the gateway: renewing
  # a certificate is then a proxy reload instead of a gateway restart (a restart would unload
  # the model and re-verify its sha256 — tens of seconds of downtime on a large model).
  # The certificate comes from an INTERNAL CA: ACME/Let's Encrypt is impossible offline.
  angie:
    image: docker.angie.software/angie:latest
    depends_on: [gateway]
    restart: unless-stopped
    volumes:
      - ../angie/infcore.conf:/etc/angie/http.d/infcore.conf:ro
      - /etc/infcore/tls:/etc/angie/tls:ro       # infcore.crt + infcore.key (key: chmod 600)
    ports:
      - "443:443"                                # HTTPS only, outward
    # edge is needed for publishing 443 to work at all (ports: has no effect on an
    # internal-only network — see the header of this file); internal is needed to reach the
    # gateway.
    networks: [edge, internal]
    read_only: true
    tmpfs:
      - /var/lib/angie:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]                # required for listen 443
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "angie", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

  # --- Metrics ----------------------------------------------------------------
  # Scrapes gateway:8080/metrics INSIDE the internal network. /metrics is never exposed
  # outward: the gateway serves it without authentication (it is meant for loopback).
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    depends_on: [gateway]
    restart: unless-stopped
    command:
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-retentionPeriod=6"                     # months; align this with your audit retention
      - "-storageDataPath=/vm-data"
    volumes:
      - ../monitoring/scrape.yml:/etc/vm/scrape.yml:ro
      - vm-data:/vm-data
    networks: [internal]
    security_opt:
      - no-new-privileges:true

volumes:
  vm-data: {}

networks:
  # No route to the internet (the offline invariant, enforced by docker). NOTE: as a side
  # effect this breaks port publishing — a container attached only to this network is
  # unreachable from outside even with ports:. Hence the gateway publishes no ports and angie
  # is what faces outward.
  internal: { driver: bridge, internal: true }
  # For angie only: publishing 443 works through it. It does have egress — in a closed
  # network there is nowhere for that egress to go anyway (the host has no internet).
  edge:     { driver: bridge }
