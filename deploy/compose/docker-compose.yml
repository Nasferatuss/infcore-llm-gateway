# infcore - локальный стек offline-контура. Образы из внутреннего реестра.
# Сеть internal: true - без выхода в интернет (offline-инвариант).
#
# Перед запуском:
#   1. cp gateway.env.example gateway.env  и вписать реальные ключи (openssl rand -hex 32).
#   2. Больше НИЧЕГО править не нужно: INFCORE_HOST=0.0.0.0 (ниже) заставляет gateway
#      слушать все интерфейсы ВНУТРИ контейнера, при этом наружу опубликован только
#      127.0.0.1:8080. Смонтированный конфиг остаётся read-only и с host=127.0.0.1 -
#      env-override имеет приоритет. Управляемые llama-server всё равно слушают loopback
#      внутри контейнера и требуют per-boot api-key (прямого доступа к ним нет).
services:
  gateway:
    image: registry.internal/infcore/gateway:0.1.0
    build:
      context: ../../..          # корень форка
      dockerfile: infcore/deploy/docker/Dockerfile
    restart: unless-stopped                        # упавший контейнер сам поднимается
    volumes:
      - /opt/infcore/models:/opt/infcore/models:ro
      - ../../config/gateway.yaml:/opt/infcore/config/gateway.yaml:ro   # read-only; host правит INFCORE_HOST
      - /var/log/infcore:/var/log/infcore          # append-only audit-журнал (на запись)
    environment:
      - INFCORE_HOST=0.0.0.0                        # слушать все интерфейсы ВНУТРИ контейнера
    env_file:
      - path: ./gateway.env                        # секреты для env:VAR в конфиге (Compose >= 2.24)
        required: false
    ports: ["127.0.0.1:8080:8080"]                 # наружу только loopback; /metrics на том же порту
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # ВНИМАНИЕ: подбирается ПОД МОДЕЛЬ, 16g - лишь дефолт под небольшие GGUF.
    # Gateway сам занимает единицы МБ, но дочерний llama-server держит в RAM всё,
    # что не уехало в VRAM. Замер: Qwen3.6-35B-A3B Q5_K_M (25.2 GiB на диске) при
    # частичном offload на 8 GiB GPU -> RSS/PSS ~20.2 GiB, т.е. с 16g контейнер
    # будет убит OOM-killer'ом. Ориентир: mem_limit >= размер GGUF - объём,
    # реально уехавший в VRAM, плюс запас на KV-кэш и compute-буферы.
    mem_limit: 16g
    healthcheck:
      test: ["CMD", "/opt/infcore/bin/infcore-cli", "--url", "http://127.0.0.1:8080", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices: [{ capabilities: [gpu] }]   # NVIDIA при GGML_CUDA=ON (нужен nvidia-container-toolkit)

# Опциональные компоненты РФ-контура. Не сконфигурированы (нет конфигов/томов) -
# раскомментировать и настроить при внедрении; для работы gateway не требуются.
#  angie:                       # reverse-proxy / TLS-терминация
#    image: registry.internal/angie/angie:latest
#    depends_on: [gateway]
#    ports: ["127.0.0.1:443:443"]
#    networks: [internal]
#  victoriametrics:             # сбор /metrics (scrape target: gateway:8080/metrics)
#    image: registry.internal/victoriametrics/victoria-metrics:latest
#    networks: [internal]

networks:
  internal: { driver: bridge, internal: true }
