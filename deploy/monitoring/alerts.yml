# infcore — alerting rules (Prometheus / vmalert).
#
# The latency thresholds below are sized for LLM inference and DEFINITELY need calibrating
# to your hardware and model: what is normal for a 35B model on 8 GiB is an outage on an
# H100. Take a baseline with a load run (infcore/tests/load/loadtest.py) and adjust the
# thresholds rather than switching the alerts off.

groups:
  - name: infcore-gateway
    rules:
      # --- Availability ------------------------------------------------------
      - alert: InfcoreGatewayDown
        expr: up{job="infcore-gateway"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "infcore gateway is not answering scrapes"
          description: "Target {{ $labels.instance }} has been unreachable for over a minute."

      # --- Audit -------------------------------------------------------------
      # The most important alert: with audit.require=true the gateway in this state answers
      # 503 to ALL traffic (fail-closed). This is an outage, not a curiosity.
      - alert: InfcoreAuditFailed
        expr: infcore_gateway_audit_failed == 1
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "The audit journal writer died — traffic is being cut fail-closed"
          description: >-
            Usually ENOSPC/EIO on the journal's partition. The gateway refuses traffic it
            cannot record. Check free disk space and permissions.

      # >0 means rotation is effectively not working and the journal is being written to the
      # renamed file. Nothing is lost, but it grows somewhere logrotate is not looking.
      - alert: InfcoreAuditReopenFailing
        expr: increase(infcore_gateway_audit_reopen_failures_total[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "The audit journal cannot be reopened after rotation"
          description: >-
            Check the service user's permissions on the journal directory and
            /etc/logrotate.d/infcore.

      # No reopens while logrotate is alive means rotation is not reaching the gateway (no
      # ExecReload, or the wrong postrotate). The journal will grow unbounded, and once it
      # hits the size limit the audit path fails closed.
      - alert: InfcoreAuditNotRotating
        expr: increase(infcore_gateway_audit_reopens_total[36h]) == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The audit journal has not been reopened for over a day"
          description: >-
            Daily rotation is expected. Check that logrotate reaches
            systemctl reload infcore-gateway (ExecReload=kill -HUP).

      # --- Errors ------------------------------------------------------------
      - alert: InfcoreBackendErrors
        expr: increase(infcore_gateway_errors_total{type=~"backend_error|backend_unreachable|backend_start_failed"}[10m]) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "llama-server backend errors: {{ $labels.type }}"
          description: "A model is failing to start or dropping out. Check the unit's journal."

      # A spike of 401s means either a key rotation went wrong or someone is guessing keys.
      - alert: InfcoreAuthFailureSpike
        expr: increase(infcore_gateway_errors_total{type="unauthorized"}[5m]) > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Spike of failed authorisations"
          description: >-
            Either a client's key expired after a rotation, or this is brute force.
            Check subject/client_ip in the audit journal.

      # --- Saturation --------------------------------------------------------
      # p95 latency. CALIBRATE THIS THRESHOLD: 30 s makes sense for a large model with a
      # partial offload; on an H100 with the model entirely in VRAM it should be far lower.
      - alert: InfcoreLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(infcore_gateway_request_duration_seconds_bucket[10m]))
          ) > 30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency is above the threshold ({{ $value | humanize }}s)"
          description: >-
            Usually queueing: more requests than llama-server has slots for.
            Compare against the baseline from your load run.

      # There are models in the registry but no backend is up while traffic is flowing ->
      # requests are hitting cold starts, or the backend is not starting at all.
      - alert: InfcoreNoBackendUnderTraffic
        expr: |
          infcore_gateway_backends_loaded == 0
          and on (instance) rate(infcore_gateway_requests_total[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Traffic is flowing but no backend is up"
          description: "Check runtime.startup_timeout_ms and errors_total{type=~\"backend_.*\"}."
