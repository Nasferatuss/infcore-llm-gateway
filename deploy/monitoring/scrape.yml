# infcore — сбор метрик. Формат Prometheus; VictoriaMetrics (vmagent/-promscrape.config)
# понимает его как есть.
#
# /metrics шлюз отдаёт БЕЗ авторизации (он рассчитан на loopback), поэтому наружу
# его выпускать нельзя: счётчики ошибок и список endpoint'ов — операционная разведка.
# Скрейпить строго внутренним адресом либо через reverse-proxy с allow-списком
# (см. deploy/angie/infcore.conf, location = /metrics).

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: infcore-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080        # <- адрес шлюза во внутренней сети контура
        labels:
          service: infcore-gateway
          contour: prod
