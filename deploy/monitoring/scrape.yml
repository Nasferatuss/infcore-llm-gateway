# infcore — metrics collection. Prometheus format; VictoriaMetrics
# (vmagent/-promscrape.config) reads it as-is.
#
# The gateway serves /metrics WITHOUT authentication (it is meant for loopback), so it must
# not be exposed outward: error counters and the endpoint list are operational intelligence.
# Scrape it strictly over an internal address, or through a reverse proxy with an allowlist
# (see deploy/angie/infcore.conf, location = /metrics).

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: infcore-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080        # <- the gateway's address on the internal network
        labels:
          service: infcore-gateway
          environment: prod
