[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infcore-sdk"
version = "0.1.0"
description = "Client SDK for the infcore gateway (offline LLM)"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []   # no external dependencies; if any are added, take them from an internal PyPI mirror

[tool.setuptools.packages.find]
where = ["."]
include = ["infcore*"]
